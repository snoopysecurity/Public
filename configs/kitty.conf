# ============================================================
# Kitty
# ============================================================

# ------------------------------------------------------------
# Theme
# ------------------------------------------------------------

# ------------------------------------------------------------
# Font
# ------------------------------------------------------------

font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto

font_size 14.0


# ------------------------------------------------------------
# Window appearance
# ------------------------------------------------------------

window_padding_width 8

background_opacity 0.95
dynamic_background_opacity yes

# Removes the little delay when hiding the mouse while typing
mouse_hide_wait 2.0

# No terminal beep
enable_audio_bell no


# ------------------------------------------------------------
# Cursor
# ------------------------------------------------------------

cursor_shape beam
cursor_blink_interval 0.5


# ------------------------------------------------------------
# Scrollback
# ------------------------------------------------------------

scrollback_lines 10000
wheel_scroll_multiplier 3.0

# Open scrollback pager
map ctrl+shift+h show_scrollback

# Show output from the last command
map ctrl+shift+g show_last_command_output


# ------------------------------------------------------------
# Shell integration
# ------------------------------------------------------------

shell_integration enabled
allow_hyperlinks yes

# ------------------------------------------------------------
# Clipboard
# ------------------------------------------------------------

copy_on_select clipboard
strip_trailing_spaces smart


# ------------------------------------------------------------
# URLs
# ------------------------------------------------------------

url_style curly
open_url_with default


# ------------------------------------------------------------
# Tabs
# ------------------------------------------------------------

tab_bar_style powerline
tab_powerline_style slanted

tab_title_template "{index}: {title}"

map ctrl+shift+t new_tab
map ctrl+shift+right next_tab
map ctrl+shift+left previous_tab


# ------------------------------------------------------------
# Layouts
#
# First entry is the default layout.
# "splits" is required for vsplit / hsplit.
# ------------------------------------------------------------

enabled_layouts splits,tall,fat,grid,stack


# ------------------------------------------------------------
# Splits
# ------------------------------------------------------------

# Horizontal split
map ctrl+shift+enter launch --location=hsplit

# Vertical split
map ctrl+shift+\ launch --location=vsplit


# ------------------------------------------------------------
# Navigate between panes
#
# Alt + Vim keys
# ------------------------------------------------------------

map alt+h neighboring_window left
map alt+l neighboring_window right
map alt+k neighboring_window up
map alt+j neighboring_window down


# ------------------------------------------------------------
# Resize panes
#
# Ctrl + Alt + Vim keys
# ------------------------------------------------------------

map ctrl+alt+h resize_window narrower 3
map ctrl+alt+l resize_window wider 3
map ctrl+alt+k resize_window taller 3
map ctrl+alt+j resize_window shorter 3

# Reset pane sizes
map ctrl+alt+0 resize_window reset


# ------------------------------------------------------------
# Layout switching
# ------------------------------------------------------------

# Cycle layouts
map ctrl+shift+l next_layout


# ------------------------------------------------------------
# Kitty hints
#
# Press Ctrl+Shift+E, then select URLs / paths / text
# ------------------------------------------------------------

map ctrl+shift+e kitten hints


# ------------------------------------------------------------
# Font resizing
# ------------------------------------------------------------

map ctrl+plus change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0 change_font_size all 0


# ------------------------------------------------------------
# Closing behaviour
# ------------------------------------------------------------

# Don't ask for confirmation when closing a Kitty OS window
confirm_os_window_close 0


# BEGIN_KITTY_THEME
# Aquarium Dark
include current-theme.conf
# END_KITTY_THEME
