# ============================================================
# Kitty
# ============================================================


# ------------------------------------------------------------
# Theme
# ------------------------------------------------------------

# Load theme first so custom overrides below take precedence
# BEGIN_KITTY_THEME
# Aquarium Dark
include current-theme.conf
# END_KITTY_THEME


# ------------------------------------------------------------
# Visual appearance
# ------------------------------------------------------------

# Terminal colors
background #0d1117
foreground #c9d1d9

# Slight transparency
background_opacity 0.98
dynamic_background_opacity yes

# Window spacing
window_padding_width 10
window_margin_width 2

# Rounded pane borders
window_border_radius 4

# Make active/inactive panes easier to distinguish
inactive_text_alpha 0.82

active_border_color   #58a6ff
inactive_border_color #30363d

# Keep the active border visible even with one pane
draw_window_borders_for_single_window yes

# Selection
selection_background #264f78
selection_foreground #ffffff


# ------------------------------------------------------------
# Font
# ------------------------------------------------------------

font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto

font_size 14.0


# ------------------------------------------------------------
# Cursor
# ------------------------------------------------------------

cursor #58a6ff
cursor_text_color #0d1117

cursor_shape beam
cursor_blink_interval 0.5


# ------------------------------------------------------------
# Window behaviour
# ------------------------------------------------------------

# Removes the little delay when hiding the mouse while typing
mouse_hide_wait 2.0

# No terminal beep
enable_audio_bell no

# Don't ask for confirmation when closing a Kitty OS window
confirm_os_window_close 0


# ------------------------------------------------------------
# Tabs
# ------------------------------------------------------------

# Clearly separated physical-style tabs
tab_bar_style slant

tab_title_template " {index}: {title} "

# Keep tab bar visually separate from terminal content
tab_bar_background #0b1016
tab_bar_margin_height 4 2
tab_bar_margin_width 4
tab_bar_margin_color #0b1016

# Active tab
active_tab_foreground   #eceff4
active_tab_background   #4c6a84
active_tab_font_style   bold

# Inactive tabs
inactive_tab_foreground #8394a5
inactive_tab_background #18212a
inactive_tab_font_style normal

map ctrl+shift+t new_tab
map ctrl+shift+right next_tab
map ctrl+shift+left previous_tab


# ------------------------------------------------------------
# Scrollback
# ------------------------------------------------------------

scrollback_lines 10000
wheel_scroll_multiplier 3.0

# Open scrollback pager
map ctrl+shift+h show_scrollback

# Show output from the last command
map ctrl+shift+g show_last_command_output


# ------------------------------------------------------------
# Shell integration
# ------------------------------------------------------------

shell_integration enabled
allow_hyperlinks yes

# Notify when a command runs for 10+ seconds and Kitty is unfocused
notify_on_cmd_finish unfocused 10


# ------------------------------------------------------------
# Clipboard
# ------------------------------------------------------------

copy_on_select clipboard
strip_trailing_spaces smart


# ------------------------------------------------------------
# URLs
# ------------------------------------------------------------

url_style curly
open_url_with default


# ------------------------------------------------------------
# Layouts
#
# First entry is the default layout.
# "splits" is required for vsplit / hsplit.
# ------------------------------------------------------------

enabled_layouts splits,tall,fat,grid,stack


# ------------------------------------------------------------
# Splits
# ------------------------------------------------------------

# Horizontal split
map ctrl+shift+enter launch --location=hsplit

# Vertical split
map ctrl+shift+\ launch --location=vsplit

# Open a new window in the current working directory
map ctrl+shift+n launch --cwd=current


# ------------------------------------------------------------
# Navigate between panes
#
# Alt + Vim keys
# ------------------------------------------------------------

map alt+h neighboring_window left
map alt+l neighboring_window right
map alt+k neighboring_window up
map alt+j neighboring_window down


# ------------------------------------------------------------
# Resize panes
#
# Ctrl + Alt + Vim keys
# ------------------------------------------------------------

map ctrl+alt+h resize_window narrower 3
map ctrl+alt+l resize_window wider 3
map ctrl+alt+k resize_window taller 3
map ctrl+alt+j resize_window shorter 3

# Reset pane sizes
map ctrl+alt+0 resize_window reset


# ------------------------------------------------------------
# Layout switching
# ------------------------------------------------------------

# Cycle layouts
map ctrl+shift+l next_layout


# ------------------------------------------------------------
# Kitty hints
#
# Press Ctrl+Shift+E, then select URLs / paths / text
# ------------------------------------------------------------

map ctrl+shift+e kitten hints


# ------------------------------------------------------------
# Font resizing
# ------------------------------------------------------------

map ctrl+plus change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0 change_font_size all 0
